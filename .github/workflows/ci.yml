name: CI

# Prüft jeden Pull Request und jeden Push auf main. Auf main wird danach – nur wenn alle
# Prüfungen grün sind – die App auf GitHub Pages veröffentlicht.
# Voraussetzung (einmalig): Settings → Pages → Source: „GitHub Actions“.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typprüfung (tsc, JSDoc)
        run: npm run typecheck

      - name: Unit-Tests (Vitest, mit Mindestabdeckung)
        run: npm run test:unit

      - name: Build (Vite)
        run: npm run build

      # Browser je Playwright-Version zwischenspeichern; Systembibliotheken werden immer installiert
      - name: Playwright-Version ermitteln
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Browser aus dem Cache
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Browser installieren
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Systembibliotheken für den Browser
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser-Tests (Playwright, gegen den Build)
        run: npm run test:e2e

      - name: Testbericht hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Der geprüfte Build ist genau das, was veröffentlicht wird
      - name: Build für GitHub Pages bereitstellen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Nur eine Veröffentlichung gleichzeitig; eine laufende wird nicht abgebrochen
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
